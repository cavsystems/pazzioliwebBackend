# URL del Web Service DIAN
dian.url.produccion=https://vpfe.dian.gov.co/WcfDianCustomerServices.svc
dian.url.pruebas=https://vpfe-hab.dian.gov.co/WcfDianCustomerServices.svc
# TestSetId para ambiente de pruebas (habilitacion)
dian.test-set-id=
# Clave tecnica de la resolucion DIAN
dian.clave-tecnica=
# Resolucion DIAN
dian.resolucion.numero=
dian.resolucion.fecha-desde=
dian.resolucion.fecha-hasta=
dian.resolucion.prefijo=FE
dian.resolucion.rango-desde=1
dian.resolucion.rango-hasta=5000000
# Certificado digital (.p12 o .pfx)
dian.certificado.ruta=
dian.certificado.password=
# Software ID y PIN registrado en DIAN
dian.software.id=
dian.software.pin=
# ID de la empresa en BD para cargar datos del emisor
dian.empresa-id=1

# ??????????????????????????????????????????????????????????
# Configuracion Proveedor Tecnologico FACTURATECH
# ??????????????????????????????????????????????????????????
# Proveedor activo de facturacion electronica: facturatech (default) | dian
facturacion.proveedor=facturatech
# Ambiente Facturatech: 1 = Produccion (pro), 2 = Pruebas (demo). Tambien se envia en ENC_20
facturatech.ambiente=2
# Usuario del Web Service = NIT del emisor (sin digito de verificacion)
facturatech.usuario=
# Contrasena Web Service (NO es la del portal; la entrega soportews@facturatech.co).
# Se puede poner en texto plano (se hashea SHA-256 automaticamente)...
facturatech.password=
# ...o ya encriptada en SHA-256 hexadecimal (tiene prioridad si se define)
facturatech.password-sha256=
# URLs del Web Service (no cambiar salvo indicacion de Facturatech)
facturatech.url.produccion=https://ws.facturatech.co/v2/pro/index.php
facturatech.url.demo=https://ws.facturatech.co/v2/demo/index.php
# Espera de firma: intentos de consulta de estado y pausa entre intentos (ms)
facturatech.intentos-estado=10
facturatech.espera-entre-intentos-ms=2000
# Descargar la representacion grafica PDF generada por Facturatech
facturatech.descargar-pdf=true

