spring.application.name=pazzioli-web-backend

# ──────────────────────────────────────────────────────────────────
# Configuración de base de datos (override con --spring.config.additional-location en producción)
# ──────────────────────────────────────────────────────────────────
spring.datasource.host=localhost
spring.datasource.port=3306
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.default-tenant=cavsystems
spring.datasource.url=jdbc:mysql://${spring.datasource.host}:${spring.datasource.port}/administrador?serverTimezone=America/Bogota&rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ──────────────────────────────────────────────────────────────────
# Backups de schemas (mysqldump)
# Sobrescribir en producción según la ruta y el binario disponible.
# ──────────────────────────────────────────────────────────────────
app.backup.path=C:\\backups
app.backup.mysqldump=mysqldump
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.sql.init.mode=always
#spring.sql.init.schema-locations=classpath:schma.sql
logging.level.org.hibernate.jpa.boot.internal.EntityManagerFactoryBuilderImpl=WARN
logging.level.org.hibernate.metamodel.model.domain.internal=WARN
logging.level.org.springframework.boot.autoconfigure.orm.jpa=WARN

# Spring Security en INFO para evitar imprimir el avatar del usuario en cada request.
# Si necesitas debug, sube a DEBUG (no TRACE, que dumpea el Authentication completo).
logging.level.org.springframework.security=INFO


server.port=4000
server.address=0.0.0.0
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.time-zone=America/Bogota
#datos de  configuracion de redix
# 127.0.0.1 explícito (no "localhost"): en Windows la JVM puede intentar resolverlo primero por
# IPv6 (::1); si Redis solo escucha en IPv4, esa conexión se queda esperando antes de reintentar
# por IPv4 — eso causaba la demora silenciosa al crear cotizaciones/ventas/pedidos, etc.
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
# Timeout corto para no colgar la petición si Redis no está disponible/lento: sin esto, Lettuce
# esperaba varios segundos por defecto antes de fallar (y ese fallo queda silenciado en el código
# que consulta la sesión activa, por lo que el único síntoma visible era la lentitud).
spring.redis.timeout=2000ms
spring.redis.connect-timeout=2000ms
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
app.test.property=hola

spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=none
# Flyway automático de Spring Boot DESACTIVADO: es redundante con TenantService,
# que migra (y repara) el schema plantilla _tenant_template en el arranque.
# Tener ambos apuntando al mismo schema causaba fallos de validación al editar migraciones.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration/common
spring.flyway.schemas=_tenant_template
eureka.client.enabled=false

spring.cloud.discovery.enabled=false

