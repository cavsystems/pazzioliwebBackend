# ──────────────────────────────────────────────────────────────────
# WhatsApp (envío de documentos: ventas, compras, devoluciones, recibos, egresos)
#
# MIENTRAS ESTÉ VACÍO/COMENTADO el botón de WhatsApp igual funciona: abre WhatsApp con el
# número y el mensaje ya escritos para que el usuario adjunte el PDF a mano (link wa.me).
# Al llenar token + phone-number-id pasa a ENVÍO AUTOMÁTICO con el PDF adjunto, sin tocar código.
#
# Cómo obtenerlos: developers.facebook.com → tu App → WhatsApp → API Setup.
#  - token: token PERMANENTE de un System User (el de prueba dura 24 h)
#  - phone-number-id: el ID del número, NO el número telefónico
#
# OJO (límite de Meta, no del sistema): un mensaje libre solo llega si el cliente escribió al
# número en las últimas 24 h. Fuera de esa ventana Meta exige una PLANTILLA aprobada y devuelve
# error; ese error se muestra en la UI.
# ──────────────────────────────────────────────────────────────────
whatsapp.cloud.token=
whatsapp.cloud.phone-number-id=
whatsapp.cloud.api-version=v21.0
whatsapp.cloud.default-country-code=57

productos.module.url=http://localhost:4000

